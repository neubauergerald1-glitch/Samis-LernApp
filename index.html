<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernapp">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Touchdown Lernapp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="app.css">

<canvas id="confetti" hidden></canvas>
<main class="wrap" id="app" aria-live="polite"></main>

<script src="content.js"></script>
<script>
/* ========================= Helpers ========================= */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const slug = s => (String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "fach").slice(0, 30);

/* ========================= State ========================= */
const DEFAULT_STATE = { v: 1, player: "Sami", points: 0, tds: 0, drives: 0, perfect: 0, drillBest: 0, topics: {}, cards: {}, badges: [] };
let S = Object.assign({}, DEFAULT_STATE, lsGet("td_state", {}));
let custom = lsGet("td_subjects", []);
let db = null, progressRef = null, syncLabel = "Auf diesem Gerät gespeichert";
let view = { name: "home" };
let saveTimer = null;

function save() {
  lsSet("td_state", S);
  if (progressRef) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => progressRef.set(JSON.parse(JSON.stringify(S))).catch(() => {}), 700);
  }
}
const subjects = () => [...BUILTIN, ...custom];
const getSubj = id => subjects().find(s => s.id === id);
const getTopic = (s, id) => s.topics.find(t => t.id === id);
const tKey = (s, t) => s.id + "|" + t.id;

/* ========================= Eltern-Benachrichtigung (ntfy) =========================
   Der Eltern-Code steht NICHT im Code, sondern nur im Browser des Geräts.
   Einrichten per Link: ...?eltern=CODE  oder in der App unter Trophäen. */
const NTFY_KEY = "td_ntfy";
const NTFY_RE = /^[A-Za-z0-9_-]{8,64}$/;
let parentJustLinked = false;
const ntfyTopic = () => { const t = lsGet(NTFY_KEY, null); return t && NTFY_RE.test(t) ? t : null; };
try {
  const u = new URL(location.href), t = u.searchParams.get("eltern");
  if (t && NTFY_RE.test(t)) {
    lsSet(NTFY_KEY, t); parentJustLinked = true;
    u.searchParams.delete("eltern");
    history.replaceState(null, "", u.pathname + u.search + u.hash);
  }
} catch {}
function notifyParent(title, message, tags) {
  const topic = ntfyTopic();
  if (!topic) return Promise.resolve(false);
  try {
    return fetch("https://ntfy.sh/", { method: "POST", keepalive: true,
      body: JSON.stringify({ topic, title, message: message + `\nPunkte gesamt: ${S.points} · Touchdowns: ${S.tds} · Karten gekonnt: ${Object.values(S.cards).filter(Boolean).length}`, tags: tags || [] }) })
      .then(r => r.ok).catch(() => false);
  } catch { return Promise.resolve(false); }
}

/* ========================= Questions ========================= */
function pool(subj, topic) {
  if (topic.quiz && topic.quiz.length) return topic.quiz.map(q => Object.assign({}, q));
  const all = subj.topics.flatMap(t => (t.cards || []).map(c => c.a));
  return (topic.cards || []).map(c => {
    const wrong = (c.wrong && c.wrong.length) ? c.wrong.slice(0, 3) : shuffle([...new Set(all.filter(a => a !== c.a))]).slice(0, 3);
    if (!wrong.length) return { type: "self", q: c.q, a: c.a };
    return { type: "mc", q: c.q, options: [c.a, ...wrong], correct: 0 };
  });
}
const subjectPool = subj => subj.topics.flatMap(t => pool(subj, t));

/* ========================= Badges ========================= */
const BADGES = [
  { id: "first", ic: "TD", name: "Erster Touchdown", desc: "Einen Drive bis in die Endzone gebracht.", ok: s => s.tds >= 1 },
  { id: "perfect", ic: "2PT", name: "Perfekter Drive", desc: "Einen Drive ohne Fehler geschafft.", ok: s => s.perfect >= 1 },
  { id: "five", ic: "5", name: "Fünf Touchdowns", desc: "Insgesamt 5 Touchdowns.", ok: s => s.tds >= 5 },
  { id: "allbio", ic: "BIO", name: "Ganzes Playbook", desc: "In jedem Biologie-Thema einen Touchdown.", ok: s => BUILTIN[0].topics.every(t => s.topics["bio|" + t.id]?.td) },
  { id: "huddle", ic: "H", name: "Huddle-Profi", desc: "30 Karteikarten als „kann ich“ markiert.", ok: s => Object.values(s.cards).filter(Boolean).length >= 30 },
  { id: "drill", ic: "2:00", name: "Two-Minute Hero", desc: "2 Touchdowns in einem Two-Minute Drill.", ok: s => s.drillBest >= 2 },
  { id: "mvp", ic: "MVP", name: "MVP", desc: "100 Punkte gesammelt.", ok: s => s.points >= 100 }
];
function checkBadges() {
  const fresh = [];
  for (const b of BADGES) if (!S.badges.includes(b.id) && b.ok(S)) { S.badges.push(b.id); fresh.push(b); }
  return fresh;
}

/* ========================= Pieces ========================= */
function countdown(test) {
  if (!test) return "";
  const t = new Date(test + "T00:00:00"), n = new Date(); n.setHours(0, 0, 0, 0);
  const d = Math.round((t - n) / 864e5);
  if (d < 0) return "";
  if (d === 0) return "Heute ist Test – du schaffst das!";
  if (d === 1) return "Morgen ist Test!";
  return `Noch ${d} Tage bis zum Test`;
}
const fmtDate = s => { if (!s) return ""; const [y, m, d] = s.split("-"); return `${+d}.${+m}.${y}`; };

function board(extra) {
  const next = subjects().filter(s => countdown(s.test)).sort((a, b) => a.test.localeCompare(b.test))[0];
  const tick = extra || (next ? `<b>${esc(next.name)}</b> · ${countdown(next.test)} (${fmtDate(next.test)})` : "Wähle ein Fach und starte deinen Drive.");
  return `<section class="board" aria-label="Anzeigetafel">
    <div class="team"><small>Quarterback</small>${esc(S.player)}</div>
    <div class="digit">${S.points}<small>Punkte</small></div>
    <div class="digit">${S.tds}<small>TDs</small></div>
    <div class="ticker">${tick}</div>
  </section>`;
}
function subjProgress(s) {
  const cards = s.topics.reduce((n, t) => n + (t.cards || []).length, 0);
  const known = s.topics.reduce((n, t) => n + (t.cards || []).filter((_, i) => S.cards[tKey(s, t) + "|" + i]).length, 0);
  const tds = s.topics.filter(t => S.topics[tKey(s, t)]?.td).length;
  return { cards, known, tds, topics: s.topics.length };
}
const BALL = `<svg viewBox="0 0 40 24" aria-hidden="true"><ellipse cx="20" cy="12" rx="19" ry="11" fill="#8a4a22"/><path d="M5 8 Q20 1 35 8 M5 16 Q20 23 35 16" stroke="#5e3015" stroke-width="1.5" fill="none"/><path d="M13 12h14M16 9.5v5M19 9.5v5M22 9.5v5M25 9.5v5" stroke="#f2f0e6" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const FLAG = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 15V2" stroke="#f2f0e6" stroke-width="1.5"/><path d="M3 2h10l-2 3 2 3H3z" fill="#f6c431"/></svg>`;
function field(yards, flagAt) {
  const nums = [10, 20, 30, 40, 50, 40, 30, 20, 10].map((n, i) => `<span class="yd" style="left:${(i + 1) * 10}%">${n}</span>`).join("");
  const y = Math.max(0, Math.min(100, yards));
  return `<div class="field" role="img" aria-label="Ball an der ${yardText(y)}">
    <div class="ez home">${esc(S.player.toUpperCase().slice(0, 8))}</div>
    <div class="turf">${nums}
      <div class="los" style="left:${y}%"></div>
      ${flagAt != null ? `<div class="flagdrop" style="left:${flagAt}%">${FLAG}</div>` : ""}
      <div class="ball" style="left:${y}%">${BALL}</div>
    </div>
    <div class="ez away">ENDZONE</div>
  </div>`;
}
const yardText = y => y >= 100 ? "Endzone" : y < 50 ? `eigenen ${Math.round(y)}` : y === 50 ? "Mittellinie" : `gegnerischen ${Math.round(100 - y)}`;

/* ========================= Views ========================= */
function go(name, params = {}) {
  if (view.name === "drive" && D && D.phase === "play" && (D.correct + D.wrongs) > 0) {
    const what = D.mode === "drill" ? "Two-Minute Drill" : `Drive „${D.t.name}“`;
    notifyParent(`${S.player} hat abgebrochen`, `${what} (${D.s.name}) abgebrochen: ${D.correct} richtig, ${D.wrongs} Fehler.`, ["warning"]);
    D.phase = "aborted";
  }
  if (D && D.timer) { clearInterval(D.timer); D.timer = null; }
  view = Object.assign({ name }, params);
  render();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}
function render() {
  const v = view.name;
  if (v === "home") return renderHome();
  if (v === "subject") return renderSubject();
  if (v === "huddle") return renderHuddle();
  if (v === "drive") return renderDrive();
  if (v === "add") return renderAdd();
  if (v === "locker") return renderLocker();
}

function renderHome() {
  const cards = subjects().map(s => {
    const p = subjProgress(s);
    const pct = p.cards ? Math.round(p.known / p.cards * 100) : 0;
    return `<button class="subj" data-act="subject" data-s="${esc(s.id)}">
      <span class="eyebrow">${s.test ? "Test am " + fmtDate(s.test) : "Fach"}</span>
      <h2>${esc(s.name)}</h2>
      <span class="meta">${p.topics} Spielzüge · ${p.tds}/${p.topics} Touchdowns</span>
      <span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span>
      <span class="meta">${p.known}/${p.cards} Karten gekonnt</span>
    </button>`;
  }).join("");
  app.innerHTML = `${board()}
    ${parentJustLinked ? `<p class="okmsg">Eltern-Benachrichtigung ist eingeschaltet.</p>` : ""}
    <div class="spread"><h1>Dein Playbook</h1><button class="btn small ghost" data-act="locker">Trophäen</button></div>
    <div class="grid">${cards}
      <button class="subj add" data-act="add"><span class="plus">+</span><span class="eyebrow">Fach hinzufügen</span></button>
    </div>
    <p class="sync">${esc(syncLabel)}</p>`;
}

function renderSubject() {
  const s = getSubj(view.s); if (!s) return go("home");
  const p = subjProgress(s);
  const rows = s.topics.map((t, i) => {
    const st = S.topics[tKey(s, t)] || {};
    const known = (t.cards || []).filter((_, k) => S.cards[tKey(s, t) + "|" + k]).length;
    const nq = pool(s, t).length;
    return `<div class="play">
      <span class="no">${i + 1}</span>
      <div class="info"><h3>${esc(t.name)}</h3>
        <div class="chips">
          <span class="chip ${known && known === (t.cards || []).length ? "ok" : ""}">Karten ${known}/${(t.cards || []).length}</span>
          <span class="chip">${nq} Fragen</span>
          ${st.td ? `<span class="chip td">Touchdown</span>` : ""}
          ${st.perfect ? `<span class="chip td">Perfekt</span>` : ""}
        </div></div>
      <div class="actions">
        ${(t.cards || []).length ? `<button class="btn small" data-act="huddle" data-s="${esc(s.id)}" data-t="${esc(t.id)}">Huddle</button>` : ""}
        ${nq ? `<button class="btn small primary" data-act="drive" data-s="${esc(s.id)}" data-t="${esc(t.id)}">Drive</button>` : ""}
      </div></div>`;
  }).join("");
  app.innerHTML = `${board(s.test && countdown(s.test) ? `<b>${esc(s.name)}</b> · ${countdown(s.test)} (${fmtDate(s.test)})` : `<b>${esc(s.name)}</b> · ${p.tds}/${p.topics} Touchdowns`)}
    <button class="back" data-act="home">← Alle Fächer</button>
    <div class="spread"><h1>${esc(s.name)}</h1>
      ${s.builtin ? "" : `<div class="row"><button class="btn small ghost" data-act="edit" data-s="${esc(s.id)}">Bearbeiten</button><button class="btn small danger" data-act="askdel">Löschen</button></div>`}
    </div>
    ${view.confirmDel ? `<div class="confirm"><span>„${esc(s.name)}“ wirklich löschen? Der Fortschritt bleibt erhalten.</span><div class="row"><button class="btn small ghost" data-act="canceldel">Abbrechen</button><button class="btn small danger" data-act="del" data-s="${esc(s.id)}">Ja, löschen</button></div></div>` : ""}
    <p class="muted"><b>Huddle</b> = Karteikarten lernen. <b>Drive</b> = Quiz: Jede richtige Antwort bringt Raumgewinn – beantworte alle Fragen und du landest in der Endzone.</p>
    <div class="plays">${rows}</div>
    ${subjectPool(s).length >= 4 ? `<section class="drill">
      <div><span class="eyebrow" style="color:var(--post)">Generalprobe</span><h2>Two-Minute Drill</h2>
      <p>2 Minuten, Fragen aus allen Themen gemischt. Jede richtige Antwort = 10 Yards. Wie viele Touchdowns schaffst du?</p></div>
      <button class="btn primary" data-act="drill" data-s="${esc(s.id)}">Snap!</button>
    </section>` : ""}`;
}

/* ---------- Huddle (Karteikarten) ---------- */
let H = null;
function startHuddle(sid, tid) {
  const s = getSubj(sid), t = getTopic(s, tid);
  H = { s, t, queue: shuffle(t.cards.map((c, i) => i)), flip: false, done: 0, total: t.cards.length, gained: 0 };
  go("huddle");
}
function renderHuddle() {
  const { s, t } = H;
  if (!H.queue.length) {
    const known = t.cards.filter((_, i) => S.cards[tKey(s, t) + "|" + i]).length;
    app.innerHTML = `${board()}
      <section class="card tdcard"><span class="eyebrow">Huddle beendet</span><h2>Break! Alle Karten durch.</h2>
        <p class="pts">${known} von ${t.cards.length} Karten kannst du${H.gained ? ` · <b>+${H.gained}</b> Punkte` : ""}</p>
        <div class="row" style="justify-content:center">
          <button class="btn" data-act="huddle" data-s="${esc(s.id)}" data-t="${esc(t.id)}">Nochmal</button>
          <button class="btn primary" data-act="drive" data-s="${esc(s.id)}" data-t="${esc(t.id)}">Jetzt der Drive</button>
        </div>
        <button class="back" data-act="subject" data-s="${esc(s.id)}" style="align-self:center">← Zum Playbook</button>
      </section>`;
    return;
  }
  const i = H.queue[0], c = t.cards[i];
  app.innerHTML = `${board(`<b>Huddle</b> · ${esc(t.name)} · noch ${H.queue.length} Karte${H.queue.length === 1 ? "" : "n"}`)}
    <button class="back" data-act="subject" data-s="${esc(s.id)}">← ${esc(s.name)}</button>
    <button class="flash ${H.flip ? "flip" : ""}" data-act="flip" aria-label="Karte umdrehen">
      <div class="flash-in">
        <div class="face"><span class="hint">Frage · tippen zum Umdrehen</span><p class="big">${esc(c.q)}</p></div>
        <div class="face ans"><span class="hint">Antwort</span><p class="big">${esc(c.a)}</p></div>
      </div>
    </button>
    ${H.flip ? `<div class="row" style="justify-content:center">
      <button class="btn" data-act="hagain">Nochmal üben</button>
      <button class="btn primary" data-act="hknow">Kann ich</button></div>`
      : `<div class="row" style="justify-content:center"><button class="btn primary" data-act="flip">Antwort zeigen</button></div>`}`;
}

/* ---------- Drive (Quiz) ---------- */
let D = null;
const CALLS_OK = ["Pass komplett!", "Snap, Pass, Fang!", "Schöner Lauf!", "Hand-off – Raumgewinn!", "Perfekter Spiralwurf!", "Durch die Lücke!"];
const CALLS_BIG = ["Big Play!", "Long Pass – was für ein Wurf!", "Niemand hält dich auf!"];
const CALLS_BAD = ["Flagge gezogen!", "Incomplete!", "Sack! Kein Raumgewinn.", "Pass abgewehrt!"];
const DOWNS = ["1st", "2nd", "3rd", "4th"];

function startDrive(sid, tid) {
  const s = getSubj(sid), t = getTopic(s, tid);
  const qs = shuffle(pool(s, t)).slice(0, 12);
  D = { mode: "drive", s, t, queue: qs, total: qs.length, step: 80 / qs.length, yards: 20, down: 0, wrongs: 0, streak: 0, correct: 0, fb: null, cur: null, flagAt: null, phase: "play" };
  nextQ(); go("drive");
}
function startDrill(sid) {
  const s = getSubj(sid);
  D = { mode: "drill", s, t: null, src: shuffle(subjectPool(s)), queue: [], yards: 20, down: 0, wrongs: 0, streak: 0, correct: 0, tdCount: 0, time: 120, fb: null, cur: null, flagAt: null, phase: "play" };
  D.queue = D.src.slice();
  nextQ(); go("drive");
  D.timer = setInterval(tick, 1000);
}
function tick() {
  if (!D || D.mode !== "drill" || D.phase !== "play") return;
  if (D.fb && !D.fb.ok) return; // pausiert, solange die Auflösung gelesen wird
  D.time--;
  const el = $("#timer");
  if (el) { el.textContent = fmtTime(D.time); el.classList.toggle("low", D.time <= 15); }
  if (D.time <= 0) { clearInterval(D.timer); D.timer = null; endDrill(); }
}
const fmtTime = s => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, "0")}`;

function nextQ() {
  if (D.mode === "drill" && !D.queue.length) D.queue = shuffle(D.src);
  const item = D.queue.shift();
  D.fb = null; D.flagAt = null;
  if (!item) { D.cur = null; return; }
  const cur = { item };
  if (item.type === "mc") cur.opts = shuffle(item.options.map((o, i) => ({ text: o, ok: i === item.correct })));
  if (item.type === "order") { cur.pool = shuffle(item.items.map((x, i) => ({ text: x, i }))); cur.ans = []; if (cur.pool.every((p, k) => p.i === k)) cur.pool.reverse(); }
  D.cur = cur;
}

function answer(ok, solution) {
  const item = D.cur.item;
  D.cur.done = true;
  if (ok) {
    D.correct++; D.streak++; D.down = 0;
    const gain = D.mode === "drill" ? 10 : D.step;
    D.yards += gain;
    const call = D.streak >= 3 ? pick(CALLS_BIG) : pick(CALLS_OK);
    D.fb = { ok: true, call, text: `+${Math.round(gain)} Yards`, explain: item.explain };
  } else {
    D.wrongs++; D.streak = 0; D.down++;
    D.flagAt = Math.min(99, D.yards + 4);
    let call = pick(CALLS_BAD), extra = "";
    if (D.down >= 4) { call = "Turnover on Downs!"; extra = "Vier Fehlversuche in Folge – kurz durchatmen, Coach sagt: weiter geht's."; D.down = 0; }
    if (D.mode === "drive") D.queue.push(item); // Frage kommt später nochmal
    D.fb = { ok: false, call, text: extra, solution, explain: item.explain };
  }
  if (D.mode === "drill" && D.yards >= 100) {
    D.tdCount++; S.points += 6; S.tds++; D.fb.call = "TOUCHDOWN! +6"; D.yards = 20; burst(); save();
  }
  render();
  if (D.mode === "drill" && ok) setTimeout(() => { if (D && D.fb && D.fb.ok && D.phase === "play") { nextQ(); render(); } }, 750);
  else setTimeout(() => $("#next")?.focus(), 30);
}
function cont() {
  if (D.mode === "drive" && !D.queue.length && D.fb?.ok) { D.yards = 100; touchdown(); return; }
  nextQ(); render();
}

function touchdown() {
  D.phase = "td";
  const k = tKey(D.s, D.t);
  const st = S.topics[k] || {};
  st.td = true; st.plays = (st.plays || 0) + 1;
  D.earned = 6; S.points += 6; S.tds++; S.drives++;
  if (D.wrongs === 0) { st.perfect = true; S.perfect++; D.earned += 2; S.points += 2; D.bonus = "two"; }
  else D.bonus = "xp";
  S.topics[k] = st;
  D.newBadges = checkBadges();
  save(); burst(); render();
  notifyParent(`Touchdown! ${S.player} hat geübt`,
    `${D.s.name} · ${D.t.name}: ${D.total} Fragen, ${D.wrongs} Fehler${D.wrongs === 0 ? " – perfekter Drive!" : "."}`, ["football"]);
}
function startXP() {
  const pl = shuffle(subjectPool(D.s));
  D.phase = "xp"; D.queue = []; D.cur = null;
  D.cur = { item: pl[0] };
  const it = pl[0];
  if (it.type === "mc") D.cur.opts = shuffle(it.options.map((o, i) => ({ text: o, ok: i === it.correct })));
  if (it.type === "order") { D.cur.pool = shuffle(it.items.map((x, i) => ({ text: x, i }))); D.cur.ans = []; }
  D.fb = null; render();
}
function xpAnswer(ok, solution) {
  D.cur.done = true;
  if (ok) { D.earned++; S.points++; D.fb = { ok: true, call: "Extra Point – gut!", text: "+1 Punkt", explain: D.cur.item.explain }; }
  else D.fb = { ok: false, call: "Daneben!", text: "Kein Extra Point, aber der Touchdown zählt.", solution, explain: D.cur.item.explain };
  D.newBadges = (D.newBadges || []).concat(checkBadges());
  save(); render();
}
function endDrill() {
  D.phase = "drillend";
  S.drillBest = Math.max(S.drillBest, D.tdCount);
  S.points += D.correct; // 1 Punkt je richtige Antwort
  D.newBadges = checkBadges();
  save(); if (D.tdCount) burst(); render();
  notifyParent(`Two-Minute Drill: ${S.player}`,
    `${D.s.name}: ${D.correct} richtig, ${D.wrongs} Fehler, ${D.tdCount} Touchdown${D.tdCount === 1 ? "" : "s"} in 2 Minuten.`, ["stopwatch"]);
}

function questionHTML() {
  const { item, opts } = D.cur, done = D.cur.done;
  const tag = { mc: "Passspiel · Wähle die richtige Antwort", tf: "Quick Snap · Stimmt das?", order: "Spielzug-Reihenfolge · Tippe in der richtigen Reihenfolge", self: "Selbstcheck" }[item.type];
  let body = "";
  if (item.type === "mc") {
    body = `<div class="opts">${opts.map((o, i) => `<button class="opt ${done ? (o.ok ? "right" : (D.cur.pickedI === i ? "wrong" : "")) : ""}" data-act="mc" data-i="${i}" ${done ? "disabled" : ""}><span class="k">${i + 1}</span><span>${esc(o.text)}</span></button>`).join("")}</div>`;
  } else if (item.type === "tf") {
    const cls = v => done ? (v === item.answer ? "right" : (D.cur.picked === v ? "wrong" : "")) : "";
    body = `<div class="tf"><button class="opt ${cls(true)}" data-act="tf" data-v="1" ${done ? "disabled" : ""}>Stimmt</button><button class="opt ${cls(false)}" data-act="tf" data-v="0" ${done ? "disabled" : ""}>Stimmt nicht</button></div>`;
  } else if (item.type === "order") {

    body = `<div class="order-ans" aria-label="Deine Reihenfolge">${c.ans.map((p, k) => `<button class="tok ${done ? (p.i === k ? "right" : "wrong") : ""}" data-act="ounpick" data-k="${k}" ${done ? "disabled" : ""}>${esc(p.text)}</button>`).join("") || `<span class="muted" style="padding:8px">Tippe unten die Begriffe in der richtigen Reihenfolge an.</span>`}</div>
      ${done ? "" : `<div class="order-pool">${c.pool.map((p, k) => `<button class="tok" data-act="opick" data-k="${k}">${esc(p.text)}</button>`).join("")}</div>
      <div class="row"><button class="btn primary" data-act="ocheck" ${c.pool.length ? "disabled" : ""}>Prüfen</button><button class="btn ghost small" data-act="oreset">Zurücksetzen</button></div>`}`;
  } else if (item.type === "self") {
    body = D.cur.shown ? `<p class="sol">${esc(item.a)}</p>${done ? "" : `<div class="row"><button class="btn" data-act="selfno">Nicht gewusst</button><button class="btn primary" data-act="selfyes">Gewusst</button></div>`}`
      : `<button class="btn primary" data-act="selfshow">Antwort zeigen</button>`;
  }
  let fb = "";

    const f = D.fb;

    fb = `<div class="feedback ${f.ok ? "good" : "bad"}"><span class="call">${esc(f.call)}</span>
      ${f.text ? `<span>${esc(f.text)}</span>` : ""}

      ${f.explain ? `<span class="muted">${esc(f.explain)}</span>` : ""}
      ${!f.ok && D.mode === "drive" && D.phase === "play" ? `<span class="muted">Diese Frage kommt im Drive nochmal.</span>` : ""}
      ${D.mode === "drill" && f.ok ? "" : `<div class="row"><button class="btn primary" id="next" data-act="${D.phase === "xp" ? "xpdone" : "next"}">${D.phase === "xp" ? "Weiter" : last ? "In die Endzone!" : "Nächster Snap"}</button></div>`}
    </div>`;
  }
  return `<section class="card"><span class="qtag">${tag}</span><p class="q">${esc(item.q)}</p>${body}${fb}</section>`;
}

function solutionText(item) {
  if (item.type === "mc") return item.options[item.correct];
  if (item.type === "tf") return item.answer ? "Stimmt" : "Stimmt nicht";
  if (item.type === "order") return item.items.join(" → ");

}
function judge(ok) {

const SAMPLE = `# Englisch Vokabeln Unit 3
F: der Bauernhof
A: the farm
F: die Ernte
A: the harvest
X: the hammer
X: the hedge

# Unregelmäßige Verben
F: go – went – ?
A: gone`;
function subjectToText(s) {
  return s.topics.map(t => `# ${t.name}\n` + (t.cards || []).map(c => `F: ${c.q}\nA: ${c.a}` + (c.wrong || []).map(w => `\nX: ${w}`).join("")).join("\n")).join("\n\n");
}
function parseText(txt) {
  const topics = []; let t = null, c = null; const errs = [];
  const lines = txt.split(/\r?\n/);
  const ensureTopic = () => { if (!t) { t = { name: "Allgemein", cards: [] }; topics.push(t); } };
  lines.forEach((raw, n) => {
    const line = raw.trim(); if (!line) return;
    if (line.startsWith("#")) { t = { name: line.replace(/^#+\s*/, "") || "Thema", cards: [] }; topics.push(t); c = null; return; }
    const m = line.match(/^([FAX])\s*:\s*(.*)$/i);
    if (!m) { if (c && c.a !== undefined) c.a += " " + line; else if (c) c.q += " " + line; else errs.push(`Zeile ${n + 1}: Bitte mit „F:“, „A:“, „X:“ oder „#“ beginnen.`); return; }
    const k = m[1].toUpperCase(), val = m[2].trim();
    if (k === "F") { ensureTopic(); c = { q: val }; t.cards.push(c); }
    else if (k === "A") { if (!c) errs.push(`Zeile ${n + 1}: Antwort ohne Frage davor.`); else c.a = val; }
    else if (k === "X") { if (!c) errs.push(`Zeile ${n + 1}: Falsche Antwort ohne Frage davor.`); else (c.wrong = c.wrong || []).push(val); }
  });
  topics.forEach(tp => tp.cards.forEach(cd => { if (!cd.a) errs.push(`„${cd.q.slice(0, 40)}“ hat keine Antwort (A:).`); }));
  const clean = topics.filter(tp => tp.cards.length).map((tp, i) => ({ id: slug(tp.name) + "-" + i, name: tp.name, cards: tp.cards.map(cd => cd.wrong ? { q: cd.q, a: cd.a || "", wrong: cd.wrong } : { q: cd.q, a: cd.a || "" }) }));
  return { topics: clean, errs };
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, sid = b.dataset.s, tid = b.dataset.t;
  switch (a) {
    case "home": go("home"); break;
    case "subject": go("subject", { s: sid }); break;
    case "add": go("add"); break;
    case "edit": go("add", { edit: sid }); break;
    case "locker": go("locker"); break;
    case "askdel": view.confirmDel = true; render(); break;
    case "canceldel": view.confirmDel = false; render(); break;
    case "del": deleteSubject(sid); break;
    case "huddle": startHuddle(sid, tid); break;
    case "drive": startDrive(sid, tid); break;
    case "drill": startDrill(sid); break;
    case "flip": H.flip = !H.flip; render(); break;
    case "hknow": {
      const k = tKey(H.s, H.t) + "|" + H.queue[0];
      if (!S.cards[k]) { S.cards[k] = true; S.points++; H.gained++; }
      H.queue.shift(); H.flip = false; checkBadges(); save(); render();
      if (!H.queue.length) {
        const known = H.t.cards.filter((_, i) => S.cards[tKey(H.s, H.t) + "|" + i]).length;
        notifyParent(`Karteikarten: ${S.player}`, `${H.s.name} · ${H.t.name}: alle Karten durch, ${known} von ${H.t.cards.length} kann er.`, ["books"]);
      }
      break;
    }
    case "hagain": { const i = H.queue.shift(); H.queue.push(i); H.flip = false; render(); break; }
    case "mc": { const i = +b.dataset.i; D.cur.pickedI = i; judge(D.cur.opts[i].ok); break; }
    case "tf": { const v = b.dataset.v === "1"; D.cur.picked = v; judge(v === D.cur.item.answer); break; }
    case "opick": { const p = D.cur.pool.splice(+b.dataset.k, 1)[0]; D.cur.ans.push(p); render(); break; }
    case "ounpick": { const p = D.cur.ans.splice(+b.dataset.k, 1)[0]; D.cur.pool.push(p); render(); break; }
    case "oreset": D.cur.pool = D.cur.pool.concat(D.cur.ans); D.cur.ans = []; render(); break;
    case "ocheck": judge(D.cur.ans.every((p, k) => p.i === k)); break;
    case "selfshow": D.cur.shown = true; render(); break;
    case "selfyes": judge(true); break;
    case "selfno": judge(false); break;
    case "next": cont(); break;
    case "xp": startXP(); break;
    case "xpdone": D.phase = "xpdone"; render(); break;
    case "savesubj": saveSubject(); break;
    case "sample": $("#f-text").value = SAMPLE; if (!$("#f-name").value) $("#f-name").value = "Englisch"; updatePreview(); break;
    case "saveplayer": { const v = $("#f-player").value.trim(); if (v) { S.player = v; save(); render(); } break; }
    case "saventfy": {
      const v = $("#f-ntfy").value.trim(), m = $("#ntfy-msg");
      if (!v) { lsSet(NTFY_KEY, null); render(); break; }
      if (!NTFY_RE.test(v)) { m.className = "err"; m.textContent = "Der Code darf nur Buchstaben, Zahlen, - und _ enthalten (8–64 Zeichen)."; break; }
      lsSet(NTFY_KEY, v); render(); $("#ntfy-msg").className = "okmsg"; $("#ntfy-msg").textContent = "Gespeichert. Schick zur Kontrolle eine Test-Nachricht."; break;
    }
    case "testntfy": {
      const m = $("#ntfy-msg"); m.className = "muted"; m.textContent = "Wird gesendet …";
      notifyParent(`Test von ${S.player}`, "Die Eltern-Benachrichtigung der Lernapp funktioniert.", ["white_check_mark"])
        .then(ok => { m.className = ok ? "okmsg" : "err"; m.textContent = ok ? "Gesendet. Die Nachricht sollte gleich auf dem Eltern-Handy ankommen." : "Senden hat nicht geklappt. Ist das Gerät online?"; });

    case "offntfy": lsSet(NTFY_KEY, null); render(); break;
    case "askreset": view.confirmReset = true; render(); break;
    case "cancelreset": view.confirmReset = false; render(); break;
    case "reset": { const p = S.player; S = Object.assign({}, DEFAULT_STATE, { player: p, topics: {}, cards: {}, badges: [] }); save(); view.confirmReset = false; render(); break; }
  }
});

function burst() {
  if (reduceMotion) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#f6c431", "#f2f0e6", "#5fd38a", "#ff7a1a", "#5aa9ff"];
  const ps = Array.from({ length: 140 }, () => ({ x: cv.width / 2, y: cv.height * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4, s: 4 + Math.random() * 6, c: pick(cols), r: Math.random() * 6 }));
  let f = 0;
  (function step() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.vx *= .99; p.r += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(step); else { ctx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  })();
}

      if (["home", "subject"].includes(view.name)) render();
    }, () => {});
    const uid = user ? await user.id() : null;
    if (uid) {
      progressRef = db.collection("data/users/" + uid).doc("progress");
      const snap = await progressRef.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && (remote.points || 0) >= (S.points || 0)) {
        S = Object.assign({}, DEFAULT_STATE, remote); lsSet("td_state", S);
        if (["home", "subject", "locker"].includes(view.name)) render();
      } else save();
    }
    if (view.name === "home" || view.name === "locker") render();
  } catch (e) { /* offline: lokal weiterspielen */ }
})();
</script>
